<!doctype html><html><head><meta charset="utf-8"><title>Pixel film</title>
<style>body{margin:0;background:#000;color:#ccc;font:14px system-ui;display:flex;gap:16px;padding:12px}video{height:90vh}</style></head>
<body><video id="v" src="netflix-pixel.mp4" controls playsinline></video><pre id="log"></pre>
<script>
const v=document.getElementById('v'),log=document.getElementById('log');window.playLog=[];
const add=(m)=>{window.playLog.push(m);log.textContent=window.playLog.join('\n');};
v.addEventListener('loadedmetadata',()=>add('duration '+v.duration.toFixed(2)+' '+v.videoWidth+'x'+v.videoHeight));
v.addEventListener('playing',()=>add('playing at '+v.currentTime.toFixed(2)));
v.addEventListener('ended',()=>{const q=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():{};add('ended at '+v.currentTime.toFixed(2)+' frames '+q.totalVideoFrames+' dropped '+q.droppedVideoFrames);});
setInterval(()=>{if(!v.paused)add('t='+v.currentTime.toFixed(1));},5000);
</script></body></html>
